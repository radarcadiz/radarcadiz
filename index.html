<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Cádiz · Entradas</title><style>:root{--n:#03152f;--g:#ffc629}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-family:Arial;color:#0a1830}header{padding:24px max(18px,calc((100% - 1080px)/2));background:linear-gradient(120deg,var(--n),#092b5c);color:white;font-weight:bold;font-size:23px}header small{display:block;font-size:12px;letter-spacing:1px;margin-top:4px}main{max-width:1080px;margin:auto;padding:28px 18px 60px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;background:white;padding:22px;border-radius:20px}.hero img{width:100%;border-radius:14px}.hero h1{font-size:clamp(30px,5vw,52px);margin:9px 0}.tag{font-weight:bold;color:#765800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 22px #07193614}.card img{width:100%;aspect-ratio:4/5;object-fit:cover}.card div{padding:16px}.card h3{margin:0 0 8px}.details{color:#526079;line-height:1.45}.cta{display:block;text-align:center;background:var(--g);color:#17233d;padding:12px;margin-top:14px;border-radius:9px;text-decoration:none;font-weight:bold}.empty{background:white;border:2px dashed #cad4e3;padding:28px;border-radius:14px;color:#526079}footer{text-align:center;padding:28px;color:#526079}@media(max-width:680px){.hero{grid-template-columns:1fr}.hero img{order:-1}}</style></head><body><header>⌾ RADAR CÁDIZ<small>NO TE PIERDAS NADA</small></header><main><section class="hero"><div><div class="tag">VENTA DE ENTRADAS</div><h1>Comprar entradas</h1><p>Los mejores planes de Cádiz, a un clic</p></div><img src="https://res.cloudinary.com/dje1az2lt/image/upload/v1788932895/cf4bea9a-abdd-4e88-9904-828aaa57ced6_bcnclh.png" alt="Radar Cádiz"></section><h2>Próximos eventos</h2><section class="grid" id="eventos"><div class="empty">Aún no hay eventos con enlace de compra disponible.</div></section></main><footer>© Radar Cádiz</footer><script>const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));fetch('eventos.json?'+Date.now()).then(r=>r.ok?r.json():[]).then(todo=>{const eventos=Array.isArray(todo)?todo.filter(e=>/sovrn/i.test(String(e.enlace_afiliado||''))):[];const caja=document.getElementById('eventos');if(!eventos.length)return;caja.innerHTML=eventos.map(e=>'<article class="card"><img src="'+esc(e.imagen_url)+'" alt="'+esc(e.evento)+'"><div><h3>'+esc(e.evento)+'</h3><p class="details">'+[e.fecha_texto,e.lugar,e.precio].filter(Boolean).map(esc).join('<br>')+'</p><a class="cta" href="'+esc(e.enlace_afiliado)+'" target="_blank" rel="sponsored noopener">🎫 Comprar entradas</a></div></article>').join('')}).catch(()=>{});</script></body></html>
